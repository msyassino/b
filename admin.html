<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rewords Admin</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script></head><body><div id="toast" class="toast"></div><main class="main"><header class="topbar"><b>Rewords Admin</b><button id="logout" class="btn ghost">خروج</button></header><section class="content"><div id="gate" class="panel" style="max-width:500px;margin:40px auto"><h2>دخول الإدارة</h2><p class="muted">الحساب يحتاج Custom Claim: admin=true أو role=admin.</p><form id="login" class="stack"><div class="field"><label>البريد</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password" required></div><button class="btn primary">دخول</button></form></div><div id="dash" class="hidden"><div class="filters"><button class="btn ghost" data-tab="overview">النظرة العامة</button><button class="btn ghost" data-tab="users">المستخدمون</button><button class="btn ghost" data-tab="orders">الطلبات</button><button class="btn ghost" data-tab="ads">الإعلانات</button><button class="btn ghost" data-tab="settings">الإعدادات</button><button class="btn ghost" data-tab="maintenance">الصيانة</button><button class="btn ghost" data-tab="export">التصدير</button></div><div id="tabs"><section id="tab-overview" class="tab panel"><div id="stats" class="stats-grid"></div></section><section id="tab-users" class="tab panel hidden"><div id="usersTable"></div></section><section id="tab-orders" class="tab panel hidden"><div id="ordersTable"></div></section><section id="tab-ads" class="tab panel hidden"><div id="adsTable"></div></section><section id="tab-settings" class="tab panel hidden"><form id="settingsForm" class="stack"><div class="field"><label>USD → MAD</label><input id="usdMad" type="number" step=".01" value="10"></div><button class="btn primary">حفظ</button></form></section><section id="tab-maintenance" class="tab panel hidden"><form id="maintForm" class="stack"><label><input id="maintEnabled" type="checkbox"> تفعيل الصيانة</label><div class="field"><label>العنوان</label><input id="maintTitle"></div><div class="field"><label>الوصف</label><input id="maintDescription"></div><div class="field"><label>العودة المتوقعة</label><input id="maintReturn"></div><button class="btn primary">حفظ</button></form></section><section id="tab-export" class="tab panel hidden"><button id="exportUsers" class="btn ghost">تصدير Users JSON</button><button id="exportOrders" class="btn ghost">تصدير Orders JSON</button></section></div></div></section></main><script src="admin.js"></script></body></html>
